name: SimpleKits
version: 1.0.0
main: com.example.simplekits.SimpleKits
api-version: '1.21'
description: Three simple PvP kits (Sword, Axe+Shield, Pot).
commands:
  kit:
    description: Open the kit menu or get a kit directly
    usage: /kit [1|2|3]
    aliases: [kits]
permissions:
  simplekits.use:
    description: Allows using /kit
    default: true
